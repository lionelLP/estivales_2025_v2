version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        - GITLAB_TOKEN=${GITLAB_TOKEN}
    container_name: estivales_app
    volumes:
      - estivales_source:/app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - DB_HOST=db
      - DB_USER=estivales
      - DB_PASSWORD=estivales_password
      - DB_NAME=estivales_db
    depends_on:
      - db

  db:
    image: mysql:8
    container_name: estivales_db
    environment:
      - MYSQL_ROOT_PASSWORD=root_password
      - MYSQL_DATABASE=estivales_db
      - MYSQL_USER=estivales
      - MYSQL_PASSWORD=estivales_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  estivales_source:
  mysql_data:
