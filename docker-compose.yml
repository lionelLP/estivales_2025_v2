version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        - GITLAB_TOKEN=${GITLAB_TOKEN}
    env_file:
      - .env
    container_name: estivales_app
    volumes:
      - estivales_source:/app
    ports:
      - "3000:3000"
    depends_on:
      - db

  db:
    image: mysql:8
    container_name: estivales_db
    command: --init-file /docker-entrypoint-initdb.d/init.sql
    env_file:
      - .env
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: estivales_phpmyadmin
    env_file:
      - .env
    ports:
      - "8080:80"
    depends_on:
      - db

volumes:
  estivales_source:
  mysql_data:
